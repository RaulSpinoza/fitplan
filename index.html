<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FitPlan">
<meta name="theme-color" content="#1f2a44">
<link rel="manifest" href="manifest.json">
<title>FitPlan – iPhone test</title>
<style>
 body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:calc(env(safe-area-inset-top) + 16px) 16px 24px;background:#1f2a44;color:#fff}
 h1{font-size:22px} .row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #ffffff22}
 .ok{color:#7CFC9A}.bad{color:#ff7b7b} button{font-size:16px;padding:12px;border-radius:10px;border:0;margin-top:16px;width:100%}
 pre{white-space:pre-wrap;font-size:12px;background:#0004;padding:8px;border-radius:8px}
</style>
</head>
<body>
<h1>FitPlan – iPhone capability test</h1>
<div id="r"></div>
<button id="pick">Test file picker (pick a FIT from iCloud Drive → RunGap → Exports)</button>
<input type="file" id="f" multiple hidden>
<pre id="out"></pre>
<script>
const r=document.getElementById('r'),out=document.getElementById('out');
const row=(k,v)=>r.insertAdjacentHTML('beforeend',`<div class="row"><span>${k}</span><b class="${v?'ok':'bad'}">${v?'YES':'NO'}</b></div>`);
const standalone=window.navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
row('Opened from Home Screen (standalone)',standalone);
row('Service worker supported','serviceWorker' in navigator);
row('IndexedDB available','indexedDB' in window);
(async()=>{
  if('serviceWorker' in navigator){try{await navigator.serviceWorker.register('sw.js');row('Service worker registered (offline)',true)}catch(e){row('Service worker registered (offline)',false)}}
  if(navigator.storage&&navigator.storage.persist){row('Persistent storage granted',await navigator.storage.persist())}else row('Persistent storage API',false);
  if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();out.textContent=`Storage quota ≈ ${(e.quota/1e6).toFixed(0)} MB\n`}
  // IndexedDB write/read test
  const req=indexedDB.open('fitplan-test',1);req.onupgradeneeded=()=>req.result.createObjectStore('k');
  req.onsuccess=()=>{const db=req.result,tx=db.transaction('k','readwrite');tx.objectStore('k').put(Date.now(),'last');
    const g=db.transaction('k').objectStore('k').get('last');g.onsuccess=()=>row('IndexedDB write/read',!!g.result)};
})();
document.getElementById('pick').onclick=()=>document.getElementById('f').click();
document.getElementById('f').onchange=async e=>{
  for(const file of e.target.files){
    const b=new Uint8Array(await file.arrayBuffer());
    const sig=String.fromCharCode(...b.slice(8,12));
    out.textContent+=`${file.name}: ${b.length} bytes, header "${sig}" ${sig==='.FIT'?'✔ valid FIT':'✘ not FIT'}\n`;
  }
};
</script>
</body>
</html>
